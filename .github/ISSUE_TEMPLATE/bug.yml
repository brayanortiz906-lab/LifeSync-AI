name: Reportar un error
description: Algo de LifeAgente AI no funciona como debería
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportarlo. **Nunca pegues tokens, claves de IA ni
        contraseñas** en este issue (ver SECURITY.md).

  - type: textarea
    id: que-pasa
    attributes:
      label: ¿Qué pasa?
      description: Qué esperabas y qué pasó en su lugar.
    validations:
      required: true

  - type: textarea
    id: como-reproducir
    attributes:
      label: ¿Cómo lo reproduzco?
      description: Pasos numerados, o el mensaje exacto que le escribiste al agente.
      placeholder: |
        1. Abro la app
        2. Escribo en el chat: "..."
        3. La pantalla queda en blanco
    validations:
      required: true

  - type: dropdown
    id: donde
    attributes:
      label: ¿Dónde te pasó?
      options:
        - Instalador .exe (Windows)
        - GitHub Pages (web)
        - Render (web + API)
        - Desarrollo local
    validations:
      required: true

  - type: textarea
    id: diagnostico
    attributes:
      label: Diagnóstico
      description: Si puedes, pega la salida de GET /api/diagnostico
      render: shell
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Versión o commit
      placeholder: v1.0.0
    validations:
      required: false
