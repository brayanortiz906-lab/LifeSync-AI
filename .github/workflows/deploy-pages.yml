name: Publicar la interfaz

# Publica la interfaz en la rama `gh-pages`, de la que GitHub Pages sirve la web.
# Se eligio este metodo (en vez de `actions/deploy-pages`) porque la API de
# despliegues de Pages se queda bloqueada si dos push se cruzan: devuelve
# "due to in progress deployment" y deja la web sin actualizar. Con la rama,
# cada push a main vuelve a publicar la web sin depender de esa API.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paginas
  cancel-in-progress: true

jobs:
  publicar:
    name: Compilar y publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Compilar la interfaz
        working-directory: frontend
        env:
          # Rutas relativas: la web funciona tanto en /LifeSync-AI/ como en la raiz.
          VITE_BASE: ${{ vars.VITE_BASE || './' }}
          # URL de la API (si se deja vacia, se usa la ruta relativa ./api).
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Publicar en la rama gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd frontend/dist
          touch .nojekyll
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: publica la interfaz"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Publicada en la rama gh-pages."
