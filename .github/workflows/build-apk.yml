name: APK de Android

# El APK es la version instalable de la web para Android.
# Se compila con Capacitor (envuelve la web en una app nativa) y Gradle.
# Cuando termine, el APK queda como artefacto de la descarga y, si el
# workflow se lanzo con un tag, tambien se publica en la release.

on:
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar tambien en la release"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # El APK se instala y ya funciona: la direccion de la API de la nube
      # queda horneada en la app, asi que no hay que configurar nada.
      - name: Compilar la interfaz
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://lifesync-ai-qs5t.onrender.com/api' }}
          VITE_BASE: './'
        run: |
          npm ci
          npm run build

      - name: Preparar el proyecto de Android (Capacitor)
        working-directory: frontend
        run: |
          npm install --no-save @capacitor/cli @capacitor/core @capacitor/android @capacitor/local-notifications
          npx cap init "LifeAgente AI" "ai.lifeagente.app" --web-dir dist
          npx cap add android
          npx cap sync android

      # Capacitor 7 compila con Java 21.
      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Gradle se queja de que kotlin-stdlib y kotlin-stdlib-jdk8 traen las
      # mismas clases: se excluye el modulo viejo (solucion de la propia
      # documentacion de Android para este error).
      - name: Corregir el conflicto de Kotlin
        working-directory: frontend
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("android/app/build.gradle")
          t = p.read_text(encoding="utf-8")
          if "kotlin-stdlib-jdk8" not in t:
              t = t.replace(
                  "dependencies {",
                  "dependencies {\n"
                  "    configurations.all {\n"
                  "        resolutionStrategy {\n"
                  "            force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'\n"
                  "            exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'\n"
                  "            exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'\n"
                  "        }\n"
                  "    }",
                  1,
              )
              p.write_text(t, encoding="utf-8")
          print("gradle corregido")
          PY

      - name: Construir el APK
        working-directory: frontend
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../LifeAgente.apk

      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeAgente-apk
          path: frontend/LifeAgente.apk
          retention-days: 30

      - name: Publicar el APK en la release
        # Ojo: en un evento "push" la entrada "publicar" viene vacia, y
        # "vacia != false" da falso -> el paso se saltaba y el APK nunca
        # llegaba a la release. Aqui solo se mira la etiqueta.
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/LifeAgente.apk
          body: |
            LifeAgente AI para Android.

            Instala el archivo `LifeAgente.apk` (permite "instalar apps de origen desconocido").
            Es la version web: entra con tu cuenta (Google, Outlook, GitHub o tu correo)
            o sigue en este equipo. La direccion del servidor ya va dentro del APK,
            asi que no hay que configurar nada.
