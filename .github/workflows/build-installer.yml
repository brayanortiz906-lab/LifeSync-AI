name: Instalador de Windows

# Compila el instalador local (LifeAgente.exe) y lo publica como descarga.
# Es gratis en repos publicos. Se ejecuta a mano o al publicar un tag v*.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  instalador:
    name: LifeAgente.exe (Windows)
    runs-on: windows-latest
    steps:
      - name: Codigo
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compilar la interfaz
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Preparar PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Generar el .exe
        run: python -m PyInstaller desktop\LifeAgente.spec --noconfirm --clean --distpath desktop\dist --workpath desktop\build

      - name: Subir el instalador
        uses: actions/upload-artifact@v4
        with:
          name: LifeAgente-windows
          path: desktop/dist/LifeAgente.exe
          retention-days: 30

      - name: Publicar la descarga (si es un tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/LifeAgente.exe
          body: |
            ## LifeAgente AI para Windows

            Descarga `LifeAgente.exe`, copialo donde quieras y doble clic.

            - No necesita instalar Python, Node ni Docker.
            - Crea la base de datos en `%APPDATA%\LifeAgente`.
            - Al cerrar la ventana, guarda una copia de tus datos y apaga todo.
