name: CI - Tests & Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests (Smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run smoke tests
        run: |
          cd backend
          python smoke.py

      - name: Verify imports
        run: |
          cd backend
          python -c "
          import app.main
          import app.config
          import app.database
          import app.models
          import app.crypto
          import app.supabase_client
          import app.auth.supabase_auth
          import app.auth.dependencies
          import app.auth.schemas
          import app.services.gemini
          import app.services.storage
          import app.services.backup
          import app.routers.auth
          import app.routers.chat
          import app.routers.accounts
          import app.routers.events
          import app.routers.tasks
          import app.routers.panels
          import app.routers.backups
          print('✅ All v2.0 modules import successfully')
          "

  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Type check
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: ./frontend
        run: npm run build

      - name: Verify build output
        run: |
          ls -la frontend/dist/
          test -f frontend/dist/index.html
          echo "✅ Frontend build successful"

  lint:
    name: Lint (optional)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: ESLint
        working-directory: ./frontend
        run: npx eslint . --ext ts,tsx --max-warnings 0 || true