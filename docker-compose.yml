version: '3.8'

services:
  # Backend API (FastAPI)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: lifeagente-backend
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=LifeAgente
      - DEBUG=true
      - ENVIRONMENT=local
      - API_V1_PREFIX=/api/v1
      - FRONTEND_URL=http://localhost:5173
      - CORS_ORIGINS=["http://localhost:5173", "http://localhost:3000", "capacitor://localhost"]
      - CRON_TOKEN=cron-token-local
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-changeme32bytesbase64keychangeme}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/lifeagente
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=587
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAIL_FROM=noreply@lifeagente.local
    volumes:
      - ./backend:/app/backend
      - ./shared:/app/shared
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - lifeagente-network

  # Frontend (Vite dev server)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: development
    container_name: lifeagente-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_SUPABASE_URL=${SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - VITE_API_URL=http://localhost:8000/api/v1
      - VITE_APP_NAME=LifeAgente
      - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - lifeagente-network

  # PostgreSQL (para desarrollo local, en prod usamos Supabase)
  db:
    image: postgres:16-alpine
    container_name: lifeagente-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=lifeagente
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lifeagente"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - lifeagente-network

  # Redis (opcional - para cache/sesiones futuras)
  redis:
    image: redis:7-alpine
    container_name: lifeagente-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - lifeagente-network

volumes:
  postgres-data:
  redis-data:

networks:
  lifeagente-network:
    driver: bridge