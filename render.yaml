# Render Blueprint para LifeAgente AI v2.1.0
# Uso: Conecta repo en Render → "New Blueprint Instance" → selecciona este archivo
# O: Render Dashboard → New → Blueprint → pega URL del repo

services:
  # Backend API (FastAPI + Supabase + Gemini BYOK)
  - type: web
    name: lifeagente-api
    runtime: docker
    repo: https://github.com/brayanortiz906-lab/LifeSync-AI
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: LifeAgente
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: API_V1_PREFIX
        value: /api/v1
      - key: FRONTEND_URL
        value: https://lifeagente.vercel.app
      - key: CORS_ORIGINS
        value: '["https://lifeagente.vercel.app", "https://brayanortiz906-lab.github.io", "capacitor://localhost"]'
      - key: CRON_TOKEN
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - fromDatabase:
          name: lifeagente-db
          property: connectionString
        key: DATABASE_URL
      - fromService:
          name: lifeagente-db
          property: connectionString
        key: DATABASE_URL_INTERNAL
      # Supabase (configurar manualmente en Render Dashboard)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Google OAuth (opcional)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Email (opcional)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        value: "noreply@lifeagente.app"
        sync: false

  # Base de datos PostgreSQL (Supabase la maneja, esto es backup/local)
  # Nota: En producción usamos Supabase, pero Render ofrece PG gratis
  - type: pserv
    name: lifeagente-db
    plan: free
    region: frankfurt
    postgresMajorVersion: 16
    # Supabase es la DB real, esto solo para desarrollo/local

databases:
  - name: lifeagente-db
    plan: free
    region: frankfurt
    postgresMajorVersion: 16